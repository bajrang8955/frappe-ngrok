<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ngrok-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="100" height="100" rx="22" fill="url(#ngrok-grad)"/>
  
  <!-- Outer Pulse Circle -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#glow-grad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Tunnel Arches -->
  <path d="M 28 64 A 24 24 0 0 1 72 64" fill="none" stroke="url(#glow-grad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 35 64 A 16 16 0 0 1 65 64" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M 42 64 A 8 8 0 0 1 58 64" fill="none" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Base / Horizon -->
  <line x1="22" y1="64" x2="78" y2="64" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Radio Signal / Beam Dot -->
  <circle cx="50" cy="32" r="3.5" fill="#34d399"/>
  <circle cx="50" cy="32" r="7" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.7"/>
</svg>

